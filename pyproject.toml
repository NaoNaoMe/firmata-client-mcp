[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firmata-client-mcp"
version = "0.1.1"
description = "MCP server for controlling Arduino GPIO over Firmata (StandardFirmata)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Naoya Imai" },
]
keywords = [
    "mcp",
    "arduino",
    "firmata",
    "gpio",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    # Upper bound: mcp 2.0 renamed FastMCP -> MCPServer and moved it to
    # mcp.server.mcpserver. Lifted once this server migrates to the v2 API.
    "mcp[cli]>=1.27.1,<2",
    "firmata-client>=0.1.0",
]

[project.scripts]
firmata-client-mcp = "firmata_client_mcp.server:main"

[project.urls]
Homepage = "https://github.com/NaoNaoMe/firmata-client-mcp"
Repository = "https://github.com/NaoNaoMe/firmata-client-mcp"
Issues = "https://github.com/NaoNaoMe/firmata-client-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/firmata_client_mcp"]